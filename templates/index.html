<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>labelprint</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --line: #2c313b;
    --fg: #e6e8ec;
    --muted: #8b93a1;
    --accent: #5b9dd9;
    --ok: #5fb87a;
    --err: #d9645b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem;
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 34rem; }
  h1 {
    font-size: 1.1rem; font-weight: 600; letter-spacing: .02em;
    margin: 0 0 .25rem;
  }
  .sub { color: var(--muted); font-size: .82rem; margin-bottom: 1.5rem; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 1.1rem; margin-bottom: 1rem;
  }
  .panel h2 {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 0 0 .8rem; font-weight: 600;
  }
  textarea, select {
    width: 100%; background: #0f1115; color: var(--fg);
    border: 1px solid var(--line); border-radius: 7px;
    padding: .65rem .75rem; font: inherit; resize: vertical;
  }
  textarea { min-height: 6.5rem; }
  textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: .6rem; align-items: center; }
  .row > select { flex: 1; }
  button {
    background: var(--accent); color: #0f1115; border: 0;
    border-radius: 7px; padding: .6rem 1.1rem;
    font: 600 .9rem/1 inherit; cursor: pointer; white-space: nowrap;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line);
  }
  button.ghost:hover { color: var(--fg); border-color: var(--muted); }
  .actions {
    display: flex; gap: .6rem; align-items: center;
    margin-top: .8rem;
  }
  .loaded {
    color: var(--muted); font-size: .82rem; margin-left: auto;
  }
  .loaded b { color: var(--fg); font-weight: 600; }
  #msg {
    min-height: 1.3rem; font-size: .85rem; margin-top: .9rem;
    color: var(--muted);
  }
  #msg.ok { color: var(--ok); }
  #msg.err { color: var(--err); }
  footer {
    color: var(--muted); font-size: .74rem;
    text-align: center; margin-top: 1.4rem;
  }
</style>
</head>
<body>
<main>
  <h1>labelprint</h1>
  <div class="sub">{{ printer }}</div>

  <div class="panel">
    <h2>Print</h2>
    <textarea id="text" placeholder="Type label text…" autofocus></textarea>
    <div class="actions">
      <button id="print">Print</button>
      <span class="loaded">Loaded: <b id="loaded">{{ current_label }}</b></span>
    </div>
    <div id="msg"></div>
  </div>

  <div class="panel">
    <h2>Change stock</h2>
    <div class="row">
      <select id="stock">
        {% for key, size in sizes.items() %}
        <option value="{{ key }}" {% if key == current %}selected{% endif %}>
          {{ size.label }}
        </option>
        {% endfor %}
      </select>
      <button id="setstock">Set &amp; calibrate</button>
    </div>
    <div class="actions">
      <button id="calibrate" class="ghost">Calibrate only</button>
    </div>
  </div>

  <footer>Ctrl/⌘ + Enter to print</footer>
</main>

<script>
const msg = document.getElementById("msg");
const buttons = [...document.querySelectorAll("button")];

function say(text, kind) {
  msg.textContent = text;
  msg.className = kind || "";
}

async function post(url, data) {
  buttons.forEach(b => b.disabled = true);
  say("Working…");
  try {
    const res = await fetch(url, { method: "POST", body: new URLSearchParams(data) });
    const json = await res.json();
    say(json.message, json.ok ? "ok" : "err");
    return json;
  } catch (err) {
    say("Request failed: " + err.message, "err");
    return { ok: false };
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

document.getElementById("print").onclick = () => {
  const text = document.getElementById("text").value;
  if (!text.trim()) return say("Nothing to print.", "err");
  post("/print", { text });
};

document.getElementById("setstock").onclick = async () => {
  const stock = document.getElementById("stock").value;
  const res = await post("/stock", { stock });
  if (res.ok && res.label) document.getElementById("loaded").textContent = res.label;
};

document.getElementById("calibrate").onclick = () => post("/calibrate", {});

document.getElementById("text").addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
    document.getElementById("print").click();
  }
});
</script>
</body>
</html>
